<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17211d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Showdown Scorekeeper"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Showdown Scorekeeper</title>
<style>
:root{--bg:#f4f6f3;--panel:#fff;--ink:#18211d;--muted:#68746d;--line:#dce3dd;--accent:#245d46;--accent2:#e4f1e9;--danger:#a43232;--shadow:0 8px 24px #17211d0c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 14px;color:var(--ink);font-weight:650}button.primary{background:var(--accent);border-color:var(--accent);color:white}button.soft{background:var(--accent2);border-color:#c6dfcf;color:var(--accent)}button.danger{color:var(--danger)}button:disabled{opacity:.4;cursor:not-allowed}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cbd5cd;border-radius:10px;background:#fff;color:var(--ink);min-width:0}textarea{min-height:112px;resize:vertical}label{display:block;font-size:13px;font-weight:750;color:#536057;margin-bottom:6px}.field{min-width:0}.stack{display:grid;gap:13px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:var(--muted)}.small{font-size:13px}.shell{max-width:1180px;margin:auto;padding:20px 18px 60px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px}.brand{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.utilitybar{display:flex;justify-content:flex-end;margin:0 0 22px}.utilitybar button{min-height:48px;min-width:132px;padding:12px 18px;touch-action:manipulation}.mark{width:44px;height:44px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px}.brand h1{font-size:20px;margin:0;letter-spacing:-.4px}.brand p{margin:1px 0 0;font-size:12px;color:var(--muted)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 20px}.tab{background:transparent}.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:var(--shadow);min-width:0}.panel h2{font-size:18px;margin:0 0 5px;letter-spacing:-.25px}.panel h3{font-size:15px;margin:0}.panel-head{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:14px}.eyebrow{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:800}.cardlist{display:grid;gap:9px}.listitem{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.listitem .desc{min-width:0}.listitem strong{display:block;overflow-wrap:anywhere}.listitem p{margin:3px 0 0;font-size:13px;color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;background:#edf1ed;color:#47544c;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800}.empty{padding:26px 14px;text-align:center;color:var(--muted);border:1px dashed #cbd5cd;border-radius:12px}.hidden{display:none!important}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.full{grid-column:1/-1}.section{margin-top:20px}.section-title{margin:0 0 10px;font-size:14px;font-weight:850}.stagechips{display:flex;gap:7px;flex-wrap:wrap}.stagechip{display:flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:white}.stagechip.active{border-color:var(--accent);background:var(--accent2)}.stagechip button{padding:0;border:0;background:transparent}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:650px;background:#fff}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}th{background:#f4f7f4;color:#5a675f;font-size:11px;text-transform:uppercase;letter-spacing:.7px}td input{width:115px;padding:8px}tr:last-child td{border-bottom:0}.rank{font-weight:850}.winner{background:#f0f8f2}.metric{font-size:26px;font-weight:850;letter-spacing:-.8px}.metriclabel{font-size:12px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat{padding:13px;background:#f6f8f6;border-radius:12px}.notice{padding:12px 14px;background:#f2f6f2;border:1px solid var(--line);border-radius:11px;font-size:13px;color:#536057}.footer-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.modal-backdrop{position:fixed;inset:0;background:#10181499;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.modal{background:#fff;width:min(680px,100%);max-height:92dvh;overflow:auto;border-radius:18px;padding:20px;box-shadow:0 20px 70px #0003}.modal h2{margin:0 0 16px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17211d;color:white;padding:12px 16px;border-radius:12px;z-index:30;box-shadow:var(--shadow);max-width:90vw}.stage-detail{padding:13px;border-radius:12px;background:#f6f8f6;white-space:pre-wrap;overflow-wrap:anywhere}.stage-event-item{display:grid;gap:7px}.stage-leaderboard{padding:0 10px 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.stage-leaderboard summary{cursor:pointer;padding:10px 2px;font-weight:750;font-size:13px}.stage-leaderboard-table table{font-size:14px}.stage-leaderboard-table th,.stage-leaderboard-table td{padding:8px 9px}.stage-leaderboard-table td:nth-child(2){white-space:normal}.help{font-size:12px;color:var(--muted);margin-top:5px}.inlineinput{display:flex;gap:8px;align-items:center}.inlineinput input{flex:1}.dangertext{color:var(--danger)}
@media(max-width:760px){.shell{padding:14px 12px 40px}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.topbar{align-items:flex-start}.brand{width:100%;align-items:center}.brand #backupBtn{margin-left:auto}.utilitybar{justify-content:flex-start;margin:0 0 18px}.utilitybar button{width:100%;min-height:52px}.panel{padding:15px}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.metric{font-size:22px}.tabs{overflow:auto;flex-wrap:nowrap;padding-bottom:4px}.tab{white-space:nowrap}.listitem{align-items:flex-start}.listitem .actions{justify-content:flex-end}.brand h1{font-size:18px}}
.score-fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.score-fields label{font-size:12px;margin-bottom:4px}.score-fields input{padding:10px 8px}.score-summary{margin-top:10px;font-size:13px;font-weight:750;color:var(--accent)}.scorecard{background:#fbfcfb;border-radius:13px}.scorecard .between{align-items:center}@media(max-width:760px){.score-fields{grid-template-columns:repeat(2,minmax(0,1fr))}.score-fields input{padding:10px 8px}.scorecard{padding:12px!important}}

/* User-selectable dark theme */
:root[data-theme="dark"]{--bg:#101512;--panel:#191f1b;--ink:#edf3ee;--muted:#a0ada4;--line:#344039;--accent:#6eb58d;--accent2:#24392d;--danger:#ff8b8b;--shadow:0 8px 24px #0005;color-scheme:dark}
:root[data-theme="dark"] body{background:var(--bg);color:var(--ink)}
:root[data-theme="dark"] button{background:#202923;color:var(--ink);border-color:var(--line)}
:root[data-theme="dark"] button.primary{background:var(--accent);border-color:var(--accent);color:#102017}
:root[data-theme="dark"] button.soft{background:var(--accent2);border-color:#3b5b46;color:#c3f0d3}
:root[data-theme="dark"] input,:root[data-theme="dark"] select,:root[data-theme="dark"] textarea{background:#111814;color:var(--ink);border-color:#46554b}
:root[data-theme="dark"] label{color:#c1ccc4}
:root[data-theme="dark"] .tab.active{background:#e2eee5;color:#17211d;border-color:#e2eee5}
:root[data-theme="dark"] .pill{background:#29362e;color:#d7e4da}
:root[data-theme="dark"] .empty{border-color:#46554b}
:root[data-theme="dark"] .stagechip{background:#202923}
:root[data-theme="dark"] .stagechip.active{background:var(--accent2);border-color:var(--accent)}
:root[data-theme="dark"] table{background:#191f1b}
:root[data-theme="dark"] th{background:#222b25;color:#c1ccc4}
:root[data-theme="dark"] .winner{background:#20372a}
:root[data-theme="dark"] .stat{background:#222b25}
:root[data-theme="dark"] .notice{background:#202923;color:#c1ccc4}

:root[data-theme="dark"] .scorecard{background:#202923}
:root[data-theme="dark"] .stage-detail{background:#222b25}

:root[data-theme="dark"] .score-summary{color:#a8e4bf}

:root[data-theme="dark"] .toast{background:#e2eee5;color:#17211d}
:root[data-theme="dark"] .panel[style*="border-color:#bfd8c7"]{border-color:#3b5b46!important}
</style></head>
<body><div class="shell">
<header class="topbar"><div class="brand"><div class="mark">S</div><div><h1>Showdown Scorekeeper</h1><p><em>Because bragging rights matter</em></p></div><button id="backupBtn">Backup / Restore</button></div></header><div class="utilitybar"><button id="themeToggle" type="button" aria-pressed="false">☾ Dark mode</button></div>
<nav class="tabs" id="tabs"><button class="tab active" data-view="events">Events</button><button class="tab" data-view="stages">Stage Library</button><button class="tab" data-view="competitors">Competitors</button></nav>
<main id="app"></main>
<div class="small muted" style="margin-top:24px;text-align:center">Private-use prototype · Export backups regularly.</div>
</div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(()=>{
const KEY='showdown-scorekeeper-v2';
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const nowDate=()=>new Date().toISOString().slice(0,10);
const blank=()=>({events:[],stages:[],competitors:[],activeEvent:null});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||blank()}catch{db=blank()}
let view='events',activeStageId=null,scoreStageId=null;
const app=document.getElementById('app'),modalRoot=document.getElementById('modalRoot');
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>root.innerHTML='',2600)}
function setView(v){view=v;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)setView(b.dataset.view)});
document.getElementById('backupBtn').onclick=backupModal;
const themeToggle=document.getElementById('themeToggle');
function applyTheme(theme){const dark=theme==='dark';document.documentElement.dataset.theme=dark?'dark':'light';themeToggle.textContent=dark?'☀ Light mode':'☾ Dark mode';themeToggle.setAttribute('aria-pressed',String(dark));document.querySelector('meta[name="theme-color"]').content=dark?'#101512':'#17211d';}
let savedTheme='light';try{savedTheme=localStorage.getItem('showdown-scorekeeper-theme')||'light'}catch{}
applyTheme(savedTheme);
themeToggle.addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme(next);try{localStorage.setItem('showdown-scorekeeper-theme',next)}catch{}});
function methodLabel(m){return ({hitfactor:'Hit factor',timeplus:'Time plus',timeonly:'Time only',pointsonly:'Points only'})[m]||m}
function eventById(id){return db.events.find(e=>e.id===id)}function stageById(id){return db.stages.find(s=>s.id===id)}
function stageForEvent(e,es){return es.snapshot||stageById(es.templateId)||{name:'Missing stage',method:'timeonly',rules:'',notes:''}}
function safeNum(v){if(v===null||v===undefined||String(v).trim()==='')return null;const n=Number(v);return Number.isFinite(n)?n:null}
function getScore(e,esId,cid){return e.scores?.[esId]?.[cid]||{time:'',points:'',penalties:'',a:'',c:'',d:'',m:'',ns:''}}
function hitFactorPoints(s,score){const a=safeNum(score.a)||0,c=safeNum(score.c)||0,d=safeNum(score.d)||0,m=safeNum(score.m)||0,ns=safeNum(score.ns)||0,pen=safeNum(score.penalties)||0;const major=(s.uspsaPowerFactor||'minor')==='major';return a*5+c*(major?4:3)+d*(major?2:1)-10*(m+ns+pen)}
function resultFor(s,score){const t=safeNum(score.time),p=safeNum(score.points),pen=safeNum(score.penalties)||0;if(s.method==='hitfactor'){if(t===null||t<=0)return null;return hitFactorPoints(s,score)/t}if(s.method==='timeplus'){if(t===null||t<0)return null;return t+pen}if(s.method==='timeonly'){if(t===null||t<0)return null;return t}if(s.method==='pointsonly'){if(p===null)return null;return p}return null}
function betterFirst(s){return s.method==='hitfactor'||s.method==='pointsonly'}
function stageResults(e,es){const s=stageForEvent(e,es);const rows=e.competitorIds.map(cid=>{const c=db.competitors.find(x=>x.id===cid)||{id:cid,name:'Unknown'};const sc=getScore(e,es.id,cid);return {cid,name:c.name,score:sc,value:resultFor(s,sc),place:null,points:0,raw:sc}}).filter(r=>r.value!==null && r.raw.status!=='dnf');rows.sort((a,b)=>betterFirst(s)?b.value-a.value:a.value-b.value);let place=0,prev=null;rows.forEach((r,i)=>{if(i===0||Math.abs(r.value-prev)>1e-8)place=i+1;r.place=place;r.points=place===1?3:place===2?2:place===3?1:0;prev=r.value});return rows}
function stageLeaderboard(e,es){const s=stageForEvent(e,es),rows=stageResults(e,es);if(!rows.length)return '<div class="empty">No completed scores for this stage yet.</div>';return `<div class="tablewrap stage-leaderboard-table"><table style="min-width:0"><thead><tr><th>Rank</th><th>Competitor</th><th>${esc(methodLabel(s.method))}</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${i===0?'winner':''}"><td class="rank">${r.place}</td><td>${esc(r.name)}</td><td><strong>${esc(scoreDisplay(s,r.raw,r.value))}</strong></td></tr>`).join('')}</tbody></table></div>`}
function overall(e){return e.competitorIds.map(cid=>{const c=db.competitors.find(x=>x.id===cid)||{id:cid,name:'Unknown'};let total=0,completed=0;for(const es of e.stages){const r=stageResults(e,es).find(x=>x.cid===cid);if(r){total+=r.points;completed++}}return {cid,name:c.name,total,completed}}).sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name))}
function render(){if(view==='events')renderEvents();else if(view==='stages')renderStages();else if(view==='competitors')renderCompetitors()}
function renderEvents(){const active=eventById(db.activeEvent);app.innerHTML=`<div class="between" style="margin-bottom:16px"><div><div class="eyebrow">Match management</div><h2 style="margin:4px 0 0;font-size:25px">Events</h2><div class="muted small">Create a match, assign competitors, add stages, and score.</div></div><button class="primary" id="newEvent">＋ New event</button></div>${active?eventDetail(active):''}<section class="panel"><div class="panel-head"><div><h2>Event history</h2><div class="muted small">Browse previous and current events.</div></div></div><div class="cardlist">${db.events.length?db.events.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(e=>`<div class="listitem"><div class="desc"><strong>${esc(e.name)}</strong><p>${esc(e.date||'No date')}${e.location?' · '+esc(e.location):''} · ${e.competitorIds.length} competitors · ${e.stages.length} stages ${e.id===db.activeEvent?'<span class="pill">OPEN</span>':''}</p></div><div class="actions"><button class="soft" data-open-event="${e.id}">${e.id===db.activeEvent?'Open':'Manage'}</button><button data-edit-event="${e.id}">Edit</button></div></div>`).join(''):'<div class="empty">No events yet. Create your first match to get started.</div>'}</div></section>`;
document.getElementById('newEvent').onclick=()=>eventModal();app.querySelectorAll('[data-open-event]').forEach(b=>b.onclick=()=>{db.activeEvent=b.dataset.openEvent;save();render()});app.querySelectorAll('[data-edit-event]').forEach(b=>b.onclick=()=>eventModal(eventById(b.dataset.editEvent)));wireEventDetail(active)}
function eventDetail(e){const scores=overall(e),es=e.stages.find(x=>x.id===scoreStageId)||e.stages[0];return `<section class="panel" style="margin-bottom:16px;border-color:#bfd8c7"><div class="panel-head"><div><div class="eyebrow">${esc(e.date||'Undated event')}${e.location?' · '+esc(e.location):''}</div><h2 style="font-size:23px;margin-top:3px">${esc(e.name)}</h2><div class="muted small">${e.competitorIds.length} competitors · ${e.stages.length} stages</div></div><div class="actions"><button data-edit-event="${e.id}">Event settings</button><button class="soft" id="exportRecap">Export Event Results</button><button class="primary" id="exportCsv">Export CSV</button></div></div><div class="stats"><div class="stat"><div class="metric">${e.competitorIds.length}</div><div class="metriclabel">Competitors</div></div><div class="stat"><div class="metric">${e.stages.length}</div><div class="metriclabel">Stages</div></div><div class="stat"><div class="metric">${scores[0]?.total??0}</div><div class="metriclabel">Leader's points</div></div></div><div class="section"><div class="between"><h3>Competitors in this event</h3><button class="soft" id="assignCompetitors">＋ Add competitors</button></div><div class="stagechips" style="margin-top:9px">${e.competitorIds.map(id=>{const c=db.competitors.find(x=>x.id===id);return c?`<span class="stagechip">${esc(c.name)} <button title="Remove from event" data-remove-competitor="${id}">×</button></span>`:''}).join('')||'<span class="muted small">No competitors assigned yet.</span>'}</div></div><div class="section"><div class="between"><h3>Stages for this match</h3><div class="actions"><button id="addFromLibrary">＋ From library</button><button class="primary" id="createStageHere">＋ New stage</button></div></div><div class="cardlist" style="margin-top:10px">${e.stages.map((es,i)=>{const s=stageForEvent(e,es);return `<div class="stage-event-item"><div class="listitem"><div class="desc"><strong>${i+1}. ${esc(s.name)}</strong><p>${esc(s.firearm||'Firearm not specified')} · ${methodLabel(s.method)} · ${stageResults(e,es).length}/${e.competitorIds.length} ranked ${es.finalized?'· <span class="pill">FINALIZED</span>':''}</p></div><div class="actions"><button ${i===0?'disabled':''} data-move-stage="up:${es.id}" title="Move stage up">↑</button><button ${i===e.stages.length-1?'disabled':''} data-move-stage="down:${es.id}" title="Move stage down">↓</button><button class="soft" data-score-stage="${es.id}">Enter scores</button><button data-stage-info="${es.id}">Stage Details</button><button class="${es.finalized?'soft':'primary'}" data-finalize-stage="${es.id}">${es.finalized?'Reopen stage':'Finalize Stage'}</button><button data-remove-stage="${es.id}" class="danger">Remove</button></div></div><details class="stage-leaderboard"><summary>Stage leaderboard</summary>${stageLeaderboard(e,es)}</details></div>`}).join('')||'<div class="empty">No stages added. Add a saved stage or create one now.</div>'}</div></div><div class="section"><div class="between"><h3>Overall leaderboard</h3><span class="pill">3 / 2 / 1 / 0 points per stage</span></div><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Rank</th><th>Competitor</th><th>Aggregate points</th><th>Stages scored</th></tr></thead><tbody>${scores.map((r,i)=>`<tr class="${i===0?'winner':''}"><td class="rank">${i+1}</td><td>${esc(r.name)}</td><td><strong>${r.total}</strong></td><td>${r.completed}/${e.stages.length}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Add competitors to see standings.</td></tr>'}</tbody></table></div><p class="help">Ties share points for their occupied position. For example, a tie for 1st gives both competitors 3 points; the next competitor is 3rd and receives 1 point.</p></div><div class="footer-actions"><button id="closeEvent">Close event view</button><button class="danger" id="deleteEvent">Delete event</button></div></section>`}
function wireEventDetail(e){if(!e)return;app.querySelectorAll('[data-edit-event]').forEach(b=>b.onclick=()=>eventModal(e));const assign=document.getElementById('assignCompetitors');if(assign)assign.onclick=()=>assignModal(e);const add=document.getElementById('addFromLibrary');if(add)add.onclick=()=>addStagesModal(e);const create=document.getElementById('createStageHere');if(create)create.onclick=()=>stageModal(null,{eventId:e.id});const exp=document.getElementById('exportCsv');if(exp)exp.onclick=()=>exportCSV(e);const recap=document.getElementById('exportRecap');if(recap)recap.onclick=()=>eventRecapModal(e);app.querySelectorAll('[data-remove-competitor]').forEach(b=>b.onclick=()=>{if(confirm('Remove this competitor from this event? Their saved competitor profile remains.')){e.competitorIds=e.competitorIds.filter(x=>x!==b.dataset.removeCompetitor);save();render()}});app.querySelectorAll('[data-remove-stage]').forEach(b=>b.onclick=()=>{if(confirm('Remove this stage from this event? Its saved library template will remain.')){e.stages=e.stages.filter(x=>x.id!==b.dataset.removeStage);save();render()}});app.querySelectorAll('[data-move-stage]').forEach(b=>b.onclick=()=>{const [dir,id]=b.dataset.moveStage.split(':');const i=e.stages.findIndex(x=>x.id===id),j=dir==='up'?i-1:i+1;if(i<0||j<0||j>=e.stages.length)return;[e.stages[i],e.stages[j]]=[e.stages[j],e.stages[i]];save();render()});app.querySelectorAll('[data-score-stage]').forEach(b=>b.onclick=()=>scoreModal(e,b.dataset.scoreStage));app.querySelectorAll('[data-stage-info]').forEach(b=>b.onclick=()=>stageInfoModal(e,b.dataset.stageInfo));app.querySelectorAll('[data-finalize-stage]').forEach(b=>b.onclick=()=>{const es=e.stages.find(x=>x.id===b.dataset.finalizeStage);if(!es)return;if(es.finalized){if(confirm('Reopen this stage? Rankings and overall standings will update as scores change.'))es.finalized=false}else{const done=e.competitorIds.every(cid=>{const sc=getScore(e,es.id,cid);return resultFor(stageForEvent(e,es),sc)!  const label=s.method==='hitfactor'?`USPSA Hit Factor · ${(s.uspsaPowerFactor||'minor').toUpperCase()} scoring`:methodLabel(s.method);
 openModal(`Score stage: ${esc(s.name)}`,`<div class="stack"><div class="notice"><strong>${label}</strong><br>${s.method==='hitfactor'?'Enter elapsed time and hit counts. A/C/D score using USPSA values; each miss, no-shoot, or procedural penalty subtracts 10 points. Hit factor = net points ÷ time.':s.method==='timeplus'?'Enter elapsed time and penalty seconds. Adjusted time = time + penalties; lowest wins.':s.method==='timeonly'?'Enter elapsed time; lowest wins.':'Enter points; highest wins.'} Blank scores are not ranked.</div>${s.rules?`<details><summary style="cursor:pointer;font-weight:750">Stage Details / rules</summary><div class="stage-detail" style="margin-top:8px">${esc(s.rules)}</div></details>`:''}<div class="stack">${rows.map(({c,sc})=>`<section class="panel scorecard" style="box-shadow:none;padding:13px"><div class="between" style="margin-bottom:10px"><strong>${esc(c.name)}</strong><select data-score-status data-cid="${c.id}" aria-label="${esc(c.name)} status" style="width:auto;max-width:150px"><option value="" ${sc.status!=='dnf'?'selected':''}>Score status</option><option value="dnf" ${sc.status==='dnf'?'selected':''}>DNF</option></select></div><div class="score-fields">${fields.map(([key,title,step])=>`<div class="field"><label for="score-${c.id}-${key}">${title}</label><input id="score-${c.id}-${key}" type="number" min="0" step="${step}" inputmode="decimal" data-score-field="${key}" data-cid="${c.id}" value="${esc(sc[key]??'')}" placeholder="—"></div>`).join('')}</div>${s.method==='hitfactor'?`<div class="score-summary" data-summary="${c.id}">Net points: ${Number(hitFactorPoints(s,sc).toFixed(2))} · Hit factor: ${safeNum(sc.time)>0?Number((hitFactorPoints(s,sc)/Number(sc.time)).toFixed(3)):'—'}</div>`:s.method==='timeplus'?`<div class="score-summary" data-summary="${c.id}">Adjusted time: ${safeNum(sc.time)!==null?Number((Number(sc.time)+(safeNum(sc.penalties)||0)).toFixed(3))+' sec':'—'}</div>`:''}</section>`).join('')||'<div class="empty">Add competitors to this event before scoring.</div>'}</div><p class="help">Enter only the fields used by this scoring method. DNF is a status, not a zero score.</p><section id="calculatedResults" class="panel hidden" style="box-shadow:none;margin-top:8px"><div class="between"><h3>Calculated leaderboard</h3><span class="pill">Preview only</span></div><div id="calculatedResultsBody" style="margin-top:10px"></div></section></div>`,`<button id="clearStageScores" class="danger">Clear stage scores</button><button id="calculateScores" class="soft">Calculate Scores</button><button id="saveScores" class="primary">Save scores</button>`);
 const readRow=cid=>{const sc={...getScore(e,esId,cid)};modalRoot.querySelectorAll(`[data-score-field][data-cid="${cid}"]`).forEach(inp=>sc[inp.dataset.scoreField]=inp.value);const status=modalRoot.querySelector(`[data-score-status][data-cid="${cid}"]`);if(status)sc.status=status.value;return sc};
 const updateSummary=cid=>{const sc=readRow(cid),cell=modalRoot.querySelector(`[data-summary="${cid}"]`);if(!cell)return;if(s.method==='hitfactor'){cell.textContent=`Net points: ${Number(hitFactorPoints(s,sc).toFixed(2))} · Hit factor: ${safeNum(sc.time)>0?Number((hitFactorPoints(s,sc)/Number(sc.time)).toFixed(3)):'—'}`}else if(s.method==='timeplus')cell.textContent=`Adjusted time: ${safeNum(sc.time)!==null?Number((Number(sc.time)+(safeNum(sc.penalties)||0)).toFixed(3))+' sec':'—'}`};
 modalRoot.querySelectorAll('[data-score-field]').forEach(inp=>inp.oninput=()=>updateSummary(inp.dataset.cid));
 document.getElementById('calculateScores').onclick=()=>{const calculated=rows.map(({c})=>{const raw=readRow(c.id);return {name:c.name,cid:c.id,raw,value:raw.status==='dnf'?null:resultFor(s,raw)}});const ranked=calculated.filter(r=>r.value!==null).sort((a,b)=>betterFirst(s)?b.value-a.value:a.value-b.value);let last=null,place=0;ranked.forEach((r,i)=>{if(i===0||Math.abs(r.value-last)>1e-8)place=i+1;r.place=place;last=r.value});const display=[...ranked,...calculated.filter(r=>r.raw.status==='dnf'),...calculated.filter(r=>r.raw.status!=='dnf'&&r.value===null)];const valueText=r=>s.method==='hitfactor'?`${r.value.toFixed(3)} HF`:s.method==='timeplus'?`${r.value.toFixed(3)} sec`:s.method==='timeonly'?`${r.value.toFixed(3)} sec`:`${r.value.toFixed(2)} pts`;const body=document.getElementById('calculatedResultsBody');body.innerHTML=display.length?`<div class="tablewrap"><table style="min-width:0"><thead><tr><th>Rank</th><th>Competitor</th><th>${esc(methodLabel(s.method))}</th></tr></thead><tbody>${display.map(r=>`<tr><td class="rank">${r.raw.status==='dnf'?'DNF':r.value===null?'—':r.place}</td><td>${esc(r.name)}</td><td>${r.raw.status==='dnf'?'Did not finish':r.value===null?'Not scored / incomplete':valueText(r)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted small">Enter complete scores to calculate a leaderboard.</p>';document.getElementById('calculatedResults').classList.remove('hidden');document.getElementById('calculatedResults').scrollIntoView({behavior:'smooth',block:'nearest'});};
 document.getElementById('saveScores').onclick=()=>{if(!e.scores)e.scores={};if(!e.scores[esId])e.scores[esId]={};rows.forEach(({c})=>{const sc=readRow(c.id);e.scores[esId][c.id]={...getScore(e,esId,c.id),...sc}});save();closeModal();render();toast('Scores saved.')};
 document.getElementById('clearStageScores').onclick=()=>{if(confirm('Clear all scores for this stage?')){delete e.scores?.[esId];save();closeModal();render();toast('Stage scores cleared.')}}
}

function recapDate(date){if(!date)return 'No date';const m=String(date).match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${Number(m[2])}/${Number(m[3])}/${m[1]}`:date}
function medalFor(place){return place===1?'🥇':place===2?'🥈':place===3?'🥉':''}
function scoreDisplay(s,raw,value){if(raw.status==='dnf')return 'DNF';if(value===null)return 'Not scored';if(s.method==='hitfactor')return `${value.toFixed(3)} HF`;if(s.method==='timeplus')return `${value.toFixed(3)} sec`;if(s.method==='timeonly')return `${value.toFixed(3)} sec`;return `${value.toFixed(2)} pts`}
function recapText(e){const all=overall(e);let last=null,rank=0;all.forEach((r,i)=>{if(i===0||r.total!==last)rank=i+1;r.place=rank;last=r.total});const lines=[`${e.name} ${recapDate(e.date)}`,'Total points:',...all.map(r=>`${r.name}: ${r.total}${medalFor(r.place)}`),''];e.stages.forEach((es,i)=>{const s=stageForEvent(e,es),results=stageResults(e,es);lines.push(`Drill #${i+1} "${s.name}"`);const placeById=new Map(results.map(r=>[r.cid,r.place]));for(const r of results){lines.push(`(${ordinal(r.place)}) ${r.name} - ${scoreDisplay(s,r.raw,r.value)}`)}for(const cid of e.competitorIds){if(!placeById.has(cid)){const c=db.competitors.find(x=>x.id===cid);if(!c)continue;const raw=getScore(e,es.id,cid);lines.push(`${c.name} - ${raw.status==='dnf'?'DNF':'Not scored'}`)}}lines.push('')});return lines.join('\n').trim()}
function ordinal(n){if(!n)return '—';const mod100=n%100;if(mod100>=11&&mod100<=13)return `${n}th`;return `${n}${({1:'st',2:'nd',3:'rd'})[n%10]||'th'}`}
function eventRecapModal(e){const txt=recapText(e);openModal('Export Event Results',`<div class="stack"><div class="notice">Review the recap before sharing. Rankings and run details are generated from the scores saved in this event. Ties share placements; missing scores are labeled instead of guessed.</div><div class="field"><label for="eventRecapText">Text recap</label><textarea id="eventRecapText" style="min-height:340px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px">${esc(txt)}</textarea></div><div class="row"><button id="copyRecap" class="primary">Copy recap</button><button id="shareRecap">Share text…</button><button id="downloadRecapImage" class="soft">Create summary image</button></div><p class="help">The image includes the overall standings and each drill’s ranked results. Long events create a taller image.</p></div>`,`<button id="recapDone">Done</button>`);document.getElementById('recapDone').onclick=closeModal;document.getElementById('copyRecap').onclick=async()=>{const text=document.getElementById('eventRecapText').value;try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(text)}else throw new Error('clipboard unavailable');toast('Recap copied.')}catch{const ta=document.getElementById('eventRecapText');ta.focus();ta.select();try{document.execCommand('copy');toast('Recap copied.')}catch{toast('Select the text and copy it manually.')}}};document.getElementById('shareRecap').onclick=async()=>{const text=document.getElementById('eventRecapText').value;if(navigator.share){try{await navigator.share({title:`${e.name} results`,text})}catch(err){if(err.name!=='AbortError')toast('Sharing is unavailable here.')}}else{document.getElementById('copyRecap').click();toast('Share is unavailable; copy the recap instead.')}};document.getElementById('downloadRecapImage').onclick=()=>createRecapImage(e,document.getElementById('eventRecapText').value)}
function createRecapImage(e,text){const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');if(!ctx){toast('Could not create image on this device.');return}const width=1000,pad=54,lineH=34,maxText=width-pad*2;ctx.font='24px system-ui, sans-serif';const wrapped=[];for(const line of text.split('\n')){if(!line){wrapped.push('');continue}let cur='';for(const word of line.split(' ')){const next=cur?cur+' '+word:word;if(ctx.measureText(next).width>maxText&&cur){wrapped.push(cur);cur=word}else cur=next}wrapped.push(cur)}const titleH=125;canvas.width=width;canvas.height=pad*2+titleH+wrapped.length*lineH;ctx.fillStyle='#f4f6f3';ctx.fillRect(0,0,width,canvas.height);ctx.fillStyle='#17211d';ctx.fillRect(0,0,width,100);ctx.fillStyle='#ffffff';ctx.font='bold 30px system-ui, sans-serif';ctx.fillText('SHOWDOWN SCOREKEEPER',pad,42);ctx.font='16px system-ui, sans-serif';ctx.fillStyle='#d6e6dc';ctx.fillText('BECAUSE BRAGGING RIGHTS MATTER',pad,72);ctx.fillStyle='#18211d';ctx.font='bold 28px system-ui, sans-serif';ctx.fillText(e.name,pad,145);ctx.font='20px system-ui, sans-serif';ctx.fillStyle='#68746d';ctx.fillText(recapDate(e.date),pad,178);let y=titleH+pad;ctx.font='22px ui-monospace, SFMono-Regular, Menlo, monospace';for(const line of wrapped){if(!line){y+=lineH*.55;continue}const heading=/^Total points:|^Drill #/.test(line);ctx.font=heading?'bold 23px system-ui, sans-serif':'21px ui-monospace, SFMono-Regular, Menlo, monospace';ctx.fillStyle=heading?'#245d46':'#18211d';ctx.fillText(line,pad,y);y+=lineH}canvas.toBlob(blob=>{if(!blob){toast('Image export failed.');return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${slug(e.name)}-results.png`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('Summary image created.')},'image/png')}
function exportCSV(e){const rows=[['Event',e.name],['Date',e.date],['Location',e.location||''],[],['Overall leaderboard'],['Rank','Competitor','Aggregate points','Stages scored'],...overall(e).map((r,i)=>[i+1,r.name,r.total,`${r.completed}/${e.stages.length}`]),[],['Stage results']];e.stages.forEach((es,i)=>{const s=stageForEvent(e,es);rows.push([], [`Stage ${i+1}`,s.name],['Rank','Competitor','Raw time (sec)','Raw points','Penalties (sec)','Calculated result','Placement points']);stageResults(e,es).forEach(r=>rows.push([r.place,r.name,r.raw.time,r.raw.points,r.raw.penalties,r.value,r.points]))});const csv=rows.map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');download(`${slug(e.name)}-results.csv`,csv,'text/csv');toast('CSV exported.')}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'match'}function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backupModal(){openModal('Backup / restore',`<div class="stack"><div class="notice"><strong>Backups:</strong> Export a backup before clearing browser data or changing devices.</div><div class="panel" style="box-shadow:none"><h3>Export full backup</h3><p class="muted small">Downloads a JSON file containing your stage library, competitor roster, events, and scores.</p><button id="exportBackup" class="primary">Download backup</button></div><div class="panel" style="box-shadow:none"><h3>Restore backup</h3><p class="muted small">Import a previous JSON backup. This replaces the data currently in this app.</p><input id="backupFile" type="file" accept="application/json,.json"><button id="importBackup" class="danger" style="margin-top:10px">Restore selected backup</button></div></div>`,`<button id="backupDone">Done</button>`);document.getElementById('backupDone').onclick=closeModal;document.getElementById('exportBackup').onclick=()=>download(`range-scorekeeper-backup-${nowDate()}.json`,JSON.stringify({...db,backupVersion:1,exportedAt:new Date().toISOString()},null,2),'application/json');document.getElementById('importBackup').onclick=async()=>{const file=document.getElementById('backupFile').files[0];if(!file){toast('Choose a backup file first.');return}try{const parsed=JSON.parse(await file.text());if(!Array.isArray(parsed.events)||!Array.isArray(parsed.stages)||!Array.isArray(parsed.competitors))throw new Error('Invalid backup');if(!confirm('Restore will replace the current app data. Continue?'))return;db={events:parsed.events,stages:parsed.stages,competitors:parsed.competitors,activeEvent:parsed.activeEvent||null};save();closeModal();render();toast('Backup restored.')}catch{toast('Could not read that backup file.')}}}
function seedDrills(){if(db.seededDrillLibraryV3)return;const templates=[
{name:'T.REX ARMS — Scrambler',firearm:'both',method:'hitfactor',uspsaPowerFactor:'minor',source:'T.REX ARMS',sourceUrl:'https://www.trex-arms.com/training/drills-assessments/scrambler-assessment-60',rules:'Starting at position A, engage the target directly in front with 2 rounds. Move toward position B and, while moving, engage the center target with 2 rounds. At B, engage the target directly in front with 2 rounds. Move diagonally to position D and, while moving, engage the center target with 2 rounds. At D, engage the target in front with 2 rounds, then move across to position C. While moving, engage the center target with 2 rounds. At C, engage the target directly in front with 2 rounds.',notes:'Setup note from prior template: 3 USPSA-style targets spaced 5 m apart; mark 4 shooting positions, 2 at 10 yd and 2 at 20 yd in front of the outermost targets. The written sequence totals 14 rounds, but the prior template lists 28; verify whether the sequence repeats before use.',needsReview:true},
{name:'Xray Alpha — Bill Drill Rundown',firearm:'both',method:'hitfactor',uspsaPowerFactor:'minor',source:'Xray Alpha',sourceUrl:'https://www.xrayalpha.com/',rules:'Starting at 20 yd, shoot one Bill Drill. Move to the 10 yd mark and shoot one Bill Drill. Reload while moving to 5 yd, then shoot the final Bill Drill. Verify start condition, reload requirement, hit standard, and intended firearm against the creator’s instructions before use.',notes:'18 rounds total as listed (three 6-round Bill Drills). Setup: one USPSA-style target with marked positions at 5, 10, and 20 yd. Confirm source details before use.',needsReview:true},
{name:'Nocturnality — Standards',firearm:'both',method:'timeplus',source:'Nocturnality',sourceUrl:'',rules:'Set up two silhouette targets. Place the first target 20 yd in front of the shooter and the second target 5 yd away at approximately 45° to the left; alternate version places the 5 yd target to the right. Mark the shooting position with a cone and glow stick. Shooter starts standing with 3 rounds in rifle and loaded pistol. On the buzzer, engage the 20 yd target with 3 chest A-zone hits and reach bolt lock. Transition to pistol and engage the 5 yd target with 2 chest A-zone hits. Safely re-holster the pistol and reload rifle. Engage the 20 yd target with 1 round to the headbox; any hit in the headbox counts. Rifle reload with at least 1 round is needed.',notes:'Time Plus; lowest total wins. C/D-zone hits are +1 sec; miss is +5 sec. Six required hits: 4 rifle and 2 pistol. Use the same left/right target variant for all competitors. Verify range safety procedures before use.',needsReview:false},
{name:'Nocturnality — Triple 7',firearm:'both',method:'timeplus',source:'Louis <3',sourceUrl:'',rules:'Set up 1 steel C-zone target at 50 yd. Shooter must make 7 hits standing, 7 kneeling, and 7 prone. Reload between positions. For night use, choose a different aiming method for each position: white light, thermal/passive, or active.',notes:'21 required impacts minimum. If the shooter moves to the next position before achieving 7 hits, each missing impact is a 3 sec penalty. Confirm permitted aiming methods and range-specific steel safety requirements.',needsReview:false}
];const existing=new Set(db.stages.map(s=>s.name));db.stages.push(...templates.filter(t=>!existing.has(t.name)).map(t=>({id:uid(),...t,updatedAt:new Date().toISOString()})));db.seededDrillLibraryV3=true;}
function seedDrillsV2(){if(db.seededDrillLibraryV2)return;const templates=[
{name:'Xray Alpha — CQB Warm-Up',firearm:'both',method:'pointsonly',source:'Xray Alpha (updated drill card)',sourceUrl:'https://img1.wsimg.com/blobby/go/5773bf1c-7f73-47c6-ab95-0700f6eba190/downloads/CQB%20Warm-Up%20UPDATE.pdf?ver=1687613319376',rules:'Two IPSC/USPSA targets. 36 rifle rounds and 12 pistol rounds. Stages: 40 yd standing 2 per target then prone 2 per target (8 rifle, 6 sec); 40 to 20 yd, 2 per target at each distance (8 rifle, 9 sec); 20 to 10 yd, 2 per target at each distance (8 rifle, 7 sec); at 10 yd, 3 rifle per target then transition to pistol for 3 per target (6 rifle + 6 pistol, 6 sec); at 7 yd, empty rifle mounted on target, transition to pistol for 3 per target (6 pistol, 3 sec); at 7 yd reload rifle from bolt lock and fire 3 per target (6 rifle, 5 sec). Each hit: A=5, C=3, D=1, miss=0. Any shot after a stage time standard counts as a miss. 240 points possible.',notes:'Standards: 216 points = 90% (“Good”); 204 points = 85% (“Pass”). Intended as a cold-start assessment. Use the linked official card for layout and all safety/range procedures.',needsReview:false}
];const existing=new Set(db.stages.map(s=>s.name));db.stages.push(...templates.filter(t=>!existing.has(t.name)).map(t=>({id:uid(),...t,updatedAt:new Date().toISOString()})));db.seededDrillLibraryV2=true;}
function initialFix(){if(db.activeEvent&&!eventById(db.activeEvent))db.activeEvent=null;db.events.forEach(e=>{e.competitorIds ||= [];e.stages ||= [];e.scores ||= {}});seedDrills();seedDrillsV2();save()}
initialFix();render();
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(err => console.warn('Offline caching setup failed', err))); }
})();
</script></body></html>
