<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17211d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Showdown Scorekeeper"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>Showdown Scorekeeper</title>
<style>
:root{--bg:#f4f6f3;--panel:#fff;--ink:#18211d;--muted:#68746d;--line:#dce3dd;--accent:#245d46;--accent2:#e4f1e9;--danger:#a43232;--shadow:0 8px 24px #17211d0c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 14px;color:var(--ink);font-weight:650}button.primary{background:var(--accent);border-color:var(--accent);color:white}button.soft{background:var(--accent2);border-color:#c6dfcf;color:var(--accent)}button.danger{color:var(--danger)}button:disabled{opacity:.4;cursor:not-allowed}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cbd5cd;border-radius:10px;background:#fff;color:var(--ink);min-width:0}textarea{min-height:112px;resize:vertical}label{display:block;font-size:13px;font-weight:750;color:#536057;margin-bottom:6px}.field{min-width:0}.stack{display:grid;gap:13px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:var(--muted)}.small{font-size:13px}.shell{max-width:1180px;margin:auto;padding:20px 18px 60px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{display:flex;gap:12px;align-items:center}.mark{width:44px;height:44px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px}.brand h1{font-size:20px;margin:0;letter-spacing:-.4px}.brand p{margin:1px 0 0;font-size:12px;color:var(--muted)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 20px}.tab{background:transparent}.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:var(--shadow);min-width:0}.panel h2{font-size:18px;margin:0 0 5px;letter-spacing:-.25px}.panel h3{font-size:15px;margin:0}.panel-head{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:14px}.eyebrow{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:800}.cardlist{display:grid;gap:9px}.listitem{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.listitem .desc{min-width:0}.listitem strong{display:block;overflow-wrap:anywhere}.listitem p{margin:3px 0 0;font-size:13px;color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;background:#edf1ed;color:#47544c;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800}.empty{padding:26px 14px;text-align:center;color:var(--muted);border:1px dashed #cbd5cd;border-radius:12px}.hidden{display:none!important}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.full{grid-column:1/-1}.section{margin-top:20px}.section-title{margin:0 0 10px;font-size:14px;font-weight:850}.stagechips{display:flex;gap:7px;flex-wrap:wrap}.stagechip{display:flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:white}.stagechip.active{border-color:var(--accent);background:var(--accent2)}.stagechip button{padding:0;border:0;background:transparent}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:650px;background:#fff}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}th{background:#f4f7f4;color:#5a675f;font-size:11px;text-transform:uppercase;letter-spacing:.7px}td input{width:115px;padding:8px}tr:last-child td{border-bottom:0}.rank{font-weight:850}.winner{background:#f0f8f2}.metric{font-size:26px;font-weight:850;letter-spacing:-.8px}.metriclabel{font-size:12px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat{padding:13px;background:#f6f8f6;border-radius:12px}.notice{padding:12px 14px;background:#f2f6f2;border:1px solid var(--line);border-radius:11px;font-size:13px;color:#536057}.footer-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.modal-backdrop{position:fixed;inset:0;background:#10181499;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.modal{background:#fff;width:min(680px,100%);max-height:92dvh;overflow:auto;border-radius:18px;padding:20px;box-shadow:0 20px 70px #0003}.modal h2{margin:0 0 16px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17211d;color:white;padding:12px 16px;border-radius:12px;z-index:30;box-shadow:var(--shadow);max-width:90vw}.stage-detail{padding:13px;border-radius:12px;background:#f6f8f6;white-space:pre-wrap;overflow-wrap:anywhere}.help{font-size:12px;color:var(--muted);margin-top:5px}.inlineinput{display:flex;gap:8px;align-items:center}.inlineinput input{flex:1}.dangertext{color:var(--danger)}
@media(max-width:760px){.shell{padding:14px 12px 40px}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.topbar{align-items:flex-start}.topbar>.row{justify-content:flex-end}.panel{padding:15px}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.metric{font-size:22px}.tabs{overflow:auto;flex-wrap:nowrap;padding-bottom:4px}.tab{white-space:nowrap}.listitem{align-items:flex-start}.listitem .actions{justify-content:flex-end}.brand h1{font-size:18px}}
</style></head>
<body><div class="shell">
<header class="topbar"><div class="brand"><div class="mark">S</div><div><h1>Showdown Scorekeeper</h1><p><em>Because bragging rights matter</em></p><p>Local-first match scoring · stored on this device</p></div></div><div class="row"><button id="backupBtn">Backup / Restore</button></div></header>
<nav class="tabs" id="tabs"><button class="tab active" data-view="events">Events</button><button class="tab" data-view="stages">Stage Library</button><button class="tab" data-view="competitors">Competitors</button></nav>
<main id="app"></main>
<div class="small muted" style="margin-top:24px;text-align:center">Private-use prototype · Data stays in this browser on this device. Export backups regularly.</div>
</div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(()=>{
const KEY='showdown-scorekeeper-v2';
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const nowDate=()=>new Date().toISOString().slice(0,10);
const blank=()=>({events:[],stages:[],competitors:[],activeEvent:null});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||blank()}catch{db=blank()}
let view='events',activeStageId=null,scoreStageId=null;
const app=document.getElementById('app'),modalRoot=document.getElementById('modalRoot');
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>root.innerHTML='',2600)}
function setView(v){view=v;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)setView(b.dataset.view)});
document.getElementById('backupBtn').onclick=backupModal;
function methodLabel(m){return ({hitfactor:'Hit factor',timeplus:'Time plus',timeonly:'Time only',pointsonly:'Points only'})[m]||m}
function eventById(id){return db.events.find(e=>e.id===id)}function stageById(id){return db.stages.find(s=>s.id===id)}
function stageForEvent(e,es){return es.snapshot||stageById(es.templateId)||{name:'Missing stage',method:'timeonly',rules:'',notes:''}}
function safeNum(v){if(v===null||v===undefined||String(v).trim()==='')return null;const n=Number(v);return Number.isFinite(n)?n:null}
function getScore(e,esId,cid){return e.scores?.[esId]?.[cid]||{time:'',points:'',penalties:''}}
function resultFor(s,score){const t=safeNum(score.time),p=safeNum(score.points),pen=safeNum(score.penalties)||0;if(s.method==='hitfactor'){if(t===null||t<=0||p===null)return null;return p/t}if(s.method==='timeplus'){if(t===null||t<0)return null;return t+pen}if(s.method==='timeonly'){if(t===null||t<0)return null;return t}if(s.method==='pointsonly'){if(p===null)return null;return p}return null}
function betterFirst(s){return s.method==='hitfactor'||s.method==='pointsonly'}
function stageResults(e,es){const s=stageForEvent(e,es);const rows=e.competitorIds.map(cid=>{const c=db.competitors.find(x=>x.id===cid)||{id:cid,name:'Unknown'};const sc=getScore(e,es.id,cid);return {cid,name:c.name,score:sc,value:resultFor(s,sc),place:null,points:0,raw:sc}}).filter(r=>r.value!==null && r.raw.status!=='dnf');rows.sort((a,b)=>betterFirst(s)?b.value-a.value:a.value-b.value);let place=0,prev=null;rows.forEach((r,i)=>{if(i===0||Math.abs(r.value-prev)>1e-8)place=i+1;r.place=place;r.points=place===1?3:place===2?2:place===3?1:0;prev=r.value});return rows}
function overall(e){return e.competitorIds.map(cid=>{const c=db.competitors.find(x=>x.id===cid)||{id:cid,name:'Unknown'};let total=0,completed=0;for(const es of e.stages){const r=stageResults(e,es).find(x=>x.cid===cid);if(r){total+=r.points;completed++}}return {cid,name:c.name,total,completed}}).sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name))}
function render(){if(view==='events')renderEvents();else if(view==='stages')renderStages();else if(view==='competitors')renderCompetitors()}
function renderEvents(){const active=eventById(db.activeEvent);app.innerHTML=`<div class="between" style="margin-bottom:16px"><div><div class="eyebrow">Match management</div><h2 style="margin:4px 0 0;font-size:25px">Events</h2><div class="muted small">Create a match, assign competitors, add stages, and score.</div></div><button class="primary" id="newEvent">＋ New event</button></div>${active?eventDetail(active):''}<section class="panel"><div class="panel-head"><div><h2>Event history</h2><div class="muted small">Past and current events stay on this device.</div></div></div><div class="cardlist">${db.events.length?db.events.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(e=>`<div class="listitem"><div class="desc"><strong>${esc(e.name)}</strong><p>${esc(e.date||'No date')}${e.location?' · '+esc(e.location):''} · ${e.competitorIds.length} competitors · ${e.stages.length} stages ${e.id===db.activeEvent?'<span class="pill">OPEN</span>':''}</p></div><div class="actions"><button class="soft" data-open-event="${e.id}">${e.id===db.activeEvent?'Open':'Manage'}</button><button data-edit-event="${e.id}">Edit</button></div></div>`).join(''):'<div class="empty">No events yet. Create your first match to get started.</div>'}</div></section>`;
document.getElementById('newEvent').onclick=()=>eventModal();app.querySelectorAll('[data-open-event]').forEach(b=>b.onclick=()=>{db.activeEvent=b.dataset.openEvent;save();render()});app.querySelectorAll('[data-edit-event]').forEach(b=>b.onclick=()=>eventModal(eventById(b.dataset.editEvent)));wireEventDetail(active)}
function eventDetail(e){const scores=overall(e),es=e.stages.find(x=>x.id===scoreStageId)||e.stages[0];return `<section class="panel" style="margin-bottom:16px;border-color:#bfd8c7"><div class="panel-head"><div><div class="eyebrow">${esc(e.date||'Undated event')}${e.location?' · '+esc(e.location):''}</div><h2 style="font-size:23px;margin-top:3px">${esc(e.name)}</h2><div class="muted small">${e.competitorIds.length} competitors · ${e.stages.length} stages</div></div><div class="actions"><button data-edit-event="${e.id}">Event settings</button><button class="primary" id="exportCsv">Export CSV</button></div></div><div class="stats"><div class="stat"><div class="metric">${e.competitorIds.length}</div><div class="metriclabel">Competitors</div></div><div class="stat"><div class="metric">${e.stages.length}</div><div class="metriclabel">Stages</div></div><div class="stat"><div class="metric">${scores[0]?.total??0}</div><div class="metriclabel">Leader's points</div></div></div><div class="section"><div class="between"><h3>Competitors in this event</h3><button class="soft" id="assignCompetitors">＋ Add competitors</button></div><div class="stagechips" style="margin-top:9px">${e.competitorIds.map(id=>{const c=db.competitors.find(x=>x.id===id);return c?`<span class="stagechip">${esc(c.name)} <button title="Remove from event" data-remove-competitor="${id}">×</button></span>`:''}).join('')||'<span class="muted small">No competitors assigned yet.</span>'}</div></div><div class="section"><div class="between"><h3>Stages for this match</h3><div class="actions"><button id="addFromLibrary">＋ From library</button><button class="primary" id="createStageHere">＋ New stage</button></div></div><div class="cardlist" style="margin-top:10px">${e.stages.map((es,i)=>{const s=stageForEvent(e,es);return `<div class="listitem"><div class="desc"><strong>${i+1}. ${esc(s.name)}</strong><p>${esc(s.firearm||'Firearm not specified')} · ${methodLabel(s.method)} · ${stageResults(e,es).length}/${e.competitorIds.length} ranked ${es.finalized?'· <span class="pill">FINALIZED</span>':''}</p></div><div class="actions"><button ${i===0?'disabled':''} data-move-stage="up:${es.id}" title="Move stage up">↑</button><button ${i===e.stages.length-1?'disabled':''} data-move-stage="down:${es.id}" title="Move stage down">↓</button><button class="soft" data-score-stage="${es.id}">Enter scores</button><button data-stage-info="${es.id}">Stage Details</button><button class="${es.finalized?'soft':'primary'}" data-finalize-stage="${es.id}">${es.finalized?'Reopen stage':'Finalize Stage'}</button><button data-remove-stage="${es.id}" class="danger">Remove</button></div></div>`}).join('')||'<div class="empty">No stages added. Add a saved stage or create one now.</div>'}</div></div><div class="section"><div class="between"><h3>Overall leaderboard</h3><span class="pill">3 / 2 / 1 / 0 points per stage</span></div><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Rank</th><th>Competitor</th><th>Aggregate points</th><th>Stages scored</th></tr></thead><tbody>${scores.map((r,i)=>`<tr class="${i===0?'winner':''}"><td class="rank">${i+1}</td><td>${esc(r.name)}</td><td><strong>${r.total}</strong></td><td>${r.completed}/${e.stages.length}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Add competitors to see standings.</td></tr>'}</tbody></table></div><p class="help">Ties share points for their occupied position. For example, a tie for 1st gives both competitors 3 points; the next competitor is 3rd and receives 1 point.</p></div><div class="footer-actions"><button id="closeEvent">Close event view</button><button class="danger" id="deleteEvent">Delete event</button></div></section>`}
function wireEventDetail(e){if(!e)return;app.querySelectorAll('[data-edit-event]').forEach(b=>b.onclick=()=>eventModal(e));const assign=document.getElementById('assignCompetitors');if(assign)assign.onclick=()=>assignModal(e);const add=document.getElementById('addFromLibrary');if(add)add.onclick=()=>addStagesModal(e);const create=document.getElementById('createStageHere');if(create)create.onclick=()=>stageModal(null,{eventId:e.id});const exp=document.getElementById('exportCsv');if(exp)exp.onclick=()=>exportCSV(e);app.querySelectorAll('[data-remove-competitor]').forEach(b=>b.onclick=()=>{if(confirm('Remove this competitor from this event? Their saved competitor profile remains.')){e.competitorIds=e.competitorIds.filter(x=>x!==b.dataset.removeCompetitor);save();render()}});app.querySelectorAll('[data-remove-stage]').forEach(b=>b.onclick=()=>{if(confirm('Remove this stage from this event? Its saved library template will remain.')){e.stages=e.stages.filter(x=>x.id!==b.dataset.removeStage);save();render()}});app.querySelectorAll('[data-move-stage]').forEach(b=>b.onclick=()=>{const [dir,id]=b.dataset.moveStage.split(':');const i=e.stages.findIndex(x=>x.id===id),j=dir==='up'?i-1:i+1;if(i<0||j<0||j>=e.stages.length)return;[e.stages[i],e.stages[j]]=[e.stages[j],e.stages[i]];save();render()});app.querySelectorAll('[data-score-stage]').forEach(b=>b.onclick=()=>scoreModal(e,b.dataset.scoreStage));app.querySelectorAll('[data-stage-info]').forEach(b=>b.onclick=()=>stageInfoModal(e,b.dataset.stageInfo));app.querySelectorAll('[data-finalize-stage]').forEach(b=>b.onclick=()=>{const es=e.stages.find(x=>x.id===b.dataset.finalizeStage);if(!es)return;if(es.finalized){if(confirm('Reopen this stage? Rankings and overall standings will update as scores change.'))es.finalized=false}else{const done=e.competitorIds.every(cid=>{const sc=getScore(e,es.id,cid);return resultFor(stageForEvent(e,es),sc)!==null||sc.status==='dnf'});if(!done&&!confirm('Some competitors have no score or DNF status. Finalize anyway?'))return;es.finalized=true;es.finalizedAt=new Date().toISOString()}save();render();toast(es.finalized?'Stage finalized.':'Stage reopened.')});const close=document.getElementById('closeEvent');if(close)close.onclick=()=>{db.activeEvent=null;save();render()};const del=document.getElementById('deleteEvent');if(del)del.onclick=()=>{if(confirm(`Permanently delete event “${e.name}”? Export it first if you need a backup.`)){db.events=db.events.filter(x=>x.id!==e.id);if(db.activeEvent===e.id)db.activeEvent=null;save();render()}}}
function renderStages(){app.innerHTML=`<div class="between" style="margin-bottom:16px"><div><div class="eyebrow">Reusable templates</div><h2 style="margin:4px 0 0;font-size:25px">Stage library</h2><div class="muted small">Create stages once, reuse them in future matches. Each event keeps its own snapshot.</div></div><button class="primary" id="newStage">＋ New stage</button></div><div class="panel"><div class="formgrid" style="margin-bottom:15px"><div class="field full"><label for="stageSearch">Search stages</label><input id="stageSearch" placeholder="Search by stage name, rules, or notes…"></div></div><div class="cardlist" id="stageList">${stageCards(db.stages)}</div></div>`;document.getElementById('newStage').onclick=()=>stageModal();document.getElementById('stageSearch').oninput=e=>document.getElementById('stageList').innerHTML=stageCards(db.stages,e.target.value);wireStageCards()}
function stageCards(stages,q=''){const filtered=stages.filter(s=>(s.name+' '+s.rules+' '+s.notes+' '+methodLabel(s.method)).toLowerCase().includes(q.toLowerCase()));return filtered.length?filtered.map(s=>`<div class="listitem"><div class="desc"><strong>${esc(s.name)}</strong><p><span class="pill">${methodLabel(s.method)}</span> ${s.rules?`· ${esc(s.rules.slice(0,95))}${s.rules.length>95?'…':''}`:''}</p><p>${s.notes?'Notes: '+esc(s.notes.slice(0,110))+(s.notes.length>110?'…':''):'No notes added'}</p></div><div class="actions"><button class="soft" data-edit-stage="${s.id}">Edit</button><button data-duplicate-stage="${s.id}">Duplicate</button><button class="danger" data-delete-stage="${s.id}">Delete</button></div></div>`).join(''):'<div class="empty">No matching stages. Create a new stage to start your library.</div>'}
function wireStageCards(){app.querySelectorAll('[data-edit-stage]').forEach(b=>b.onclick=()=>stageModal(stageById(b.dataset.editStage)));app.querySelectorAll('[data-duplicate-stage]').forEach(b=>b.onclick=()=>{const s=stageById(b.dataset.duplicateStage);stageModal({...structuredClone(s),id:null,name:s.name+' (Copy)'})});app.querySelectorAll('[data-delete-stage]').forEach(b=>b.onclick=()=>{const s=stageById(b.dataset.deleteStage);if(confirm(`Delete saved template “${s.name}”? Existing event copies are not affected.`)){db.stages=db.stages.filter(x=>x.id!==s.id);save();render()}})}
function renderCompetitors(){app.innerHTML=`<div class="between" style="margin-bottom:16px"><div><div class="eyebrow">Reusable roster</div><h2 style="margin:4px 0 0;font-size:25px">Competitors</h2><div class="muted small">Save names once and add them to any event.</div></div><button class="primary" id="newCompetitor">＋ Add competitor</button></div><section class="panel"><div class="field" style="margin-bottom:14px"><label for="competitorSearch">Search competitors</label><input id="competitorSearch" placeholder="Search names…"></div><div class="cardlist" id="competitorList">${competitorCards(db.competitors)}</div></section>`;document.getElementById('newCompetitor').onclick=()=>competitorModal();document.getElementById('competitorSearch').oninput=e=>{document.getElementById('competitorList').innerHTML=competitorCards(db.competitors,e.target.value);wireCompetitorCards()};wireCompetitorCards()}
function competitorCards(list,q=''){const filtered=list.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));return filtered.length?filtered.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<div class="listitem"><div class="desc"><strong>${esc(c.name)}</strong><p>Saved competitor</p></div><div class="actions"><button data-edit-competitor="${c.id}">Rename</button><button class="danger" data-delete-competitor="${c.id}">Delete</button></div></div>`).join(''):'<div class="empty">No competitors saved yet.</div>'}
function wireCompetitorCards(){app.querySelectorAll('[data-edit-competitor]').forEach(b=>b.onclick=()=>competitorModal(db.competitors.find(c=>c.id===b.dataset.editCompetitor)));app.querySelectorAll('[data-delete-competitor]').forEach(b=>b.onclick=()=>{const c=db.competitors.find(x=>x.id===b.dataset.deleteCompetitor);if(confirm(`Delete “${c.name}” from the reusable roster? Existing event score history is retained, but this name may display as Unknown if the profile is removed.`)){db.competitors=db.competitors.filter(x=>x.id!==c.id);save();render()}})}
function openModal(title,body,buttons){modalRoot.innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal"><div class="between"><h2>${title}</h2><button id="closeModal" aria-label="Close">✕</button></div>${body}<div class="footer-actions" style="justify-content:flex-end">${buttons||''}</div></div></div>`;document.getElementById('closeModal').onclick=closeModal;document.getElementById('backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()}}
function closeModal(){modalRoot.innerHTML=''}
function eventModal(e=null){const editing=!!e;openModal(editing?'Edit event':'Create event',`<form id="eventForm" class="stack"><div class="field"><label for="eventName">Event name *</label><input id="eventName" required maxlength="100" value="${esc(e?.name||'')}" placeholder="e.g. Fall Run & Gun"></div><div class="field"><label for="eventDate">Date</label><input id="eventDate" type="date" value="${esc(e?.date||nowDate())}"></div><div class="field"><label for="eventLocation">Location</label><input id="eventLocation" value="${esc(e?.location||'')}" placeholder="Range / venue"></div><div class="field"><label for="eventDescription">Event notes (optional)</label><textarea id="eventDescription" placeholder="Match notes or other details">${esc(e?.description||'')}</textarea></div></form>`,`<button id="saveEvent" class="primary">Save event</button>`);document.getElementById('saveEvent').onclick=()=>{const name=document.getElementById('eventName').value.trim();if(!name){toast('Enter an event name.');return}if(editing){e.name=name;e.date=document.getElementById('eventDate').value;e.location=document.getElementById('eventLocation').value.trim();e.description=document.getElementById('eventDescription').value}else{e={id:uid(),name,date:document.getElementById('eventDate').value,location:document.getElementById('eventLocation').value.trim(),description:document.getElementById('eventDescription').value,competitorIds:[],stages:[],scores:{}};db.events.push(e);db.activeEvent=e.id}save();closeModal();render()}}
function stageModal(s=null,opts={}){const editing=!!(s&&s.id),data=s||{name:'',method:'hitfactor',rules:'',notes:''};openModal(editing?'Edit stage template':'Create stage',`<form id="stageForm" class="stack"><div class="field"><label for="stageName">Stage name *</label><input id="stageName" required maxlength="100" value="${esc(data.name)}" placeholder="e.g. Rooftop to Rooftop"></div><div class="field"><label for="stageFirearm">Firearm type</label><select id="stageFirearm"><option value="both" ${(data.firearm||'both')==='both'?'selected':''}>Pistol + rifle / both</option><option value="pistol" ${data.firearm==='pistol'?'selected':''}>Pistol</option><option value="rifle" ${data.firearm==='rifle'?'selected':''}>Rifle</option></select></div><div class="field"><label for="stageMethod">Scoring method *</label><select id="stageMethod"><option value="hitfactor" ${data.method==='hitfactor'?'selected':''}>Hit factor — points ÷ time, highest wins</option><option value="timeplus" ${data.method==='timeplus'?'selected':''}>Time plus — time + penalties, lowest wins</option><option value="timeonly" ${data.method==='timeonly'?'selected':''}>Time only — lowest time wins</option><option value="pointsonly" ${data.method==='pointsonly'?'selected':''}>Points only — highest points wins</option></select></div><div class="field"><label for="stageRules">Stage rules / instructions</label><textarea id="stageRules" placeholder="Start position, target sequence, limits, penalties, safety or procedural rules…">${esc(data.rules||'')}</textarea></div><div class="field"><label for="stageNotes">Notes</label><textarea id="stageNotes" placeholder="Distances, setup details, equipment, wind notes, lessons learned…">${esc(data.notes||'')}</textarea></div><div class="notice">This template is saved in the local stage library. Adding it to an event creates a separate snapshot, so later template edits won't change historical matches.</div></form>`,`<button id="saveStage" class="primary">${editing?'Save changes':'Save stage'}</button>`);document.getElementById('saveStage').onclick=()=>{const name=document.getElementById('stageName').value.trim();if(!name){toast('Enter a stage name.');return}const stage={id:editing?s.id:uid(),name,firearm:document.getElementById('stageFirearm').value,method:document.getElementById('stageMethod').value,rules:document.getElementById('stageRules').value.trim(),notes:document.getElementById('stageNotes').value.trim(),updatedAt:new Date().toISOString()};if(editing){const i=db.stages.findIndex(x=>x.id===s.id);if(i>=0)db.stages[i]=stage}else db.stages.push(stage);save();closeModal();if(opts.eventId){const ev=eventById(opts.eventId);if(ev){ev.stages.push({id:uid(),templateId:stage.id,snapshot:structuredClone(stage)});save();db.activeEvent=ev.id;view='events';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));render()}}else render()}}
function competitorModal(c=null){openModal(c?'Rename competitor':'Add competitor',`<div class="field"><label for="competitorName">Competitor name *</label><input id="competitorName" maxlength="100" value="${esc(c?.name||'')}" placeholder="Full name"></div>`,`<button id="saveCompetitor" class="primary">Save</button>`);document.getElementById('saveCompetitor').onclick=()=>{const name=document.getElementById('competitorName').value.trim();if(!name){toast('Enter a name.');return}if(db.competitors.some(x=>x.name.toLowerCase()===name.toLowerCase()&&x.id!==c?.id)){toast('That name is already in the roster.');return}if(c)c.name=name;else db.competitors.push({id:uid(),name});save();closeModal();render()}}
function assignModal(e){const options=db.competitors.slice().sort((a,b)=>a.name.localeCompare(b.name));openModal('Add competitors to event',`<div class="stack"><div class="field"><label for="newRosterName">Quick-add a new competitor</label><div class="inlineinput"><input id="newRosterName" placeholder="Competitor name"><button id="quickAdd" class="soft">Add name</button></div></div><div class="field"><label>Saved roster</label><div class="cardlist" id="assignList">${options.length?options.map(c=>`<label class="listitem" style="margin:0;display:flex;align-items:center;gap:10px"><input type="checkbox" data-assign="${c.id}" style="width:20px;height:20px" ${e.competitorIds.includes(c.id)?'checked':''}><span style="flex:1;color:var(--ink);font-size:15px">${esc(c.name)}</span>${e.competitorIds.includes(c.id)?'<span class="pill">Added</span>':''}</label>`).join(''):'<div class="empty">No saved competitors. Add one above.</div>'}</div></div></div>`,`<button id="saveAssignments" class="primary">Done</button>`);document.getElementById('quickAdd').onclick=()=>{const input=document.getElementById('newRosterName'),name=input.value.trim();if(!name)return;let c=db.competitors.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!c){c={id:uid(),name};db.competitors.push(c)}if(!e.competitorIds.includes(c.id))e.competitorIds.push(c.id);save();assignModal(e)};document.getElementById('saveAssignments').onclick=()=>{const selected=[...modalRoot.querySelectorAll('[data-assign]:checked')].map(x=>x.dataset.assign);e.competitorIds=[...new Set([...e.competitorIds.filter(id=>!options.some(c=>c.id===id)),...selected])];save();closeModal();render()}}
function addStagesModal(e){const available=db.stages;openModal('Add stages from library',`<div class="stack"><p class="muted small">Select saved templates to add. Each selected stage is copied into this event; the library template remains unchanged.</p><div class="cardlist">${available.length?available.map(s=>`<label class="listitem" style="display:flex;align-items:center;gap:10px"><input type="checkbox" data-add-stage="${s.id}" style="width:20px;height:20px"><span style="flex:1;color:var(--ink);font-size:15px"><strong>${esc(s.name)}</strong><span class="muted small" style="display:block">${methodLabel(s.method)}</span></span></label>`).join(''):'<div class="empty">Your library is empty. Create a stage first.</div>'}</div></div>`,`<button id="addSelectedStages" class="primary">Add selected stages</button>`);document.getElementById('addSelectedStages').onclick=()=>{const ids=[...modalRoot.querySelectorAll('[data-add-stage]:checked')].map(x=>x.dataset.addStage);ids.forEach(id=>{const s=stageById(id);if(s)e.stages.push({id:uid(),templateId:s.id,snapshot:structuredClone(s)})});save();closeModal();render();toast(`${ids.length} stage${ids.length===1?'':'s'} added.`)}}
function stageInfoModal(e,esId){const es=e.stages.find(x=>x.id===esId),s=stageForEvent(e,es);openModal(esc(s.name),`<div class="stack"><div><span class="pill">${methodLabel(s.method)}</span> <span class="pill">${esc(s.firearm||'both')}</span></div><div><div class="section-title">Rules / instructions</div><div class="stage-detail">${esc(s.rules||'No rules recorded.')}</div></div><div><div class="section-title">Notes</div><div class="stage-detail">${esc(s.notes||'No notes recorded.')}</div></div><p class="help">These are the rules and notes saved with this event's stage snapshot.</p></div>`,`<button id="editEventStage">Edit this event's copy</button>`);document.getElementById('editEventStage').onclick=()=>{closeModal();eventStageEditModal(e,es)}}
function eventStageEditModal(e,es){const s=stageForEvent(e,es);openModal('Edit event stage',`<div class="stack"><div class="field"><label for="copyName">Stage name</label><input id="copyName" value="${esc(s.name)}"></div><div class="field"><label for="copyFirearm">Firearm type</label><select id="copyFirearm"><option value="both" ${(s.firearm||'both')==='both'?'selected':''}>Pistol + rifle / both</option><option value="pistol" ${s.firearm==='pistol'?'selected':''}>Pistol</option><option value="rifle" ${s.firearm==='rifle'?'selected':''}>Rifle</option></select></div><div class="field"><label for="copyMethod">Scoring method</label><select id="copyMethod"><option value="hitfactor" ${s.method==='hitfactor'?'selected':''}>Hit factor</option><option value="timeplus" ${s.method==='timeplus'?'selected':''}>Time plus</option><option value="timeonly" ${s.method==='timeonly'?'selected':''}>Time only</option><option value="pointsonly" ${s.method==='pointsonly'?'selected':''}>Points only</option></select></div><div class="field"><label for="copyRules">Rules / instructions</label><textarea id="copyRules">${esc(s.rules||'')}</textarea></div><div class="field"><label for="copyNotes">Notes</label><textarea id="copyNotes">${esc(s.notes||'')}</textarea></div><div class="notice">Changes apply only to this event's copy, not the saved library template.</div></div>`,`<button id="saveEventStage" class="primary">Save event stage</button>`);document.getElementById('saveEventStage').onclick=()=>{es.snapshot={...s,name:document.getElementById('copyName').value.trim()||s.name,firearm:document.getElementById('copyFirearm').value,method:document.getElementById('copyMethod').value,rules:document.getElementById('copyRules').value,notes:document.getElementById('copyNotes').value};save();closeModal();render()}}
function scoreModal(e,esId){const es=e.stages.find(x=>x.id===esId),s=stageForEvent(e,es);scoreStageId=esId;const results=stageResults(e,es),byId=Object.fromEntries(results.map(r=>[r.cid,r]));const rows=e.competitorIds.map(cid=>{const c=db.competitors.find(x=>x.id===cid)||{id:cid,name:'Unknown'};const sc=getScore(e,esId,cid),r=byId[cid];return {c,sc,r}});openModal(`Score stage: ${esc(s.name)}`,`<div class="stack"><div class="notice">${methodLabel(s.method)}. ${s.method==='hitfactor'?'Enter points and elapsed time. Highest points ÷ time wins.':s.method==='timeplus'?'Enter elapsed time and any penalty seconds. Lowest adjusted time wins.':s.method==='timeonly'?'Enter elapsed time. Lowest time wins.':'Enter points. Highest score wins.'} Blank scores are not ranked. Save after entering or editing values.</div>${s.rules?`<details><summary style="cursor:pointer;font-weight:750">View stage rules</summary><div class="stage-detail" style="margin-top:8px">${esc(s.rules)}</div></details>`:''}<div class="tablewrap"><table><thead><tr><th>Competitor</th>${s.method!=='pointsonly'?'<th>Time (sec)</th>':''}${s.method!=='timeonly'?'<th>Points</th>':''}${s.method==='timeplus'?'<th>Penalty (sec)</th>':''}<th>Status</th><th>Calculated</th><th>Place</th><th>Match pts</th></tr></thead><tbody>${rows.map(({c,sc,r})=>`<tr><td><strong>${esc(c.name)}</strong></td>${s.method!=='pointsonly'?`<td><input type="number" min="0" step="0.001" inputmode="decimal" data-score-field="time" data-cid="${c.id}" value="${esc(sc.time)}" placeholder="sec"></td>`:''}${s.method!=='timeonly'?`<td><input type="number" min="0" step="0.01" inputmode="decimal" data-score-field="points" data-cid="${c.id}" value="${esc(sc.points)}" placeholder="points"></td>`:''}${s.method==='timeplus'?`<td><input type="number" min="0" step="0.1" inputmode="decimal" data-score-field="penalties" data-cid="${c.id}" value="${esc(sc.penalties)}" placeholder="sec"></td>`:''}<td><select data-score-status data-cid="${c.id}"><option value="" ${sc.status!=='dnf'?'selected':''}>Scored / pending</option><option value="dnf" ${sc.status==='dnf'?'selected':''}>DNF</option></select></td><td data-calculated="${c.id}">${r?Number(r.value.toFixed(3)): '—'}</td><td data-place="${c.id}">${r?r.place:'—'}</td><td data-matchpoints="${c.id}">${r?r.points:'—'}</td></tr>`).join('')}</tbody></table></div><p class="help">Time values are seconds. Hit factor is points divided by time. Time plus adds penalty seconds. For time-only stages, points aren't required.</p></div>`,`<button id="clearStageScores" class="danger">Clear stage scores</button><button id="saveScores" class="primary">Save scores</button>`);modalRoot.querySelectorAll('[data-score-field]').forEach(inp=>inp.oninput=()=>{const cid=inp.dataset.cid,sc={...getScore(e,esId,cid)};sc[inp.dataset.scoreField]=inp.value;const v=resultFor(s,sc);const cell=modalRoot.querySelector(`[data-calculated="${cid}"]`);if(cell)cell.textContent=v===null?'—':Number(v.toFixed(3));});document.getElementById('saveScores').onclick=()=>{if(!e.scores)e.scores={};if(!e.scores[esId])e.scores[esId]={};modalRoot.querySelectorAll('[data-score-field]').forEach(inp=>{const cid=inp.dataset.cid;if(!e.scores[esId][cid])e.scores[esId][cid]={time:'',points:'',penalties:''};e.scores[esId][cid][inp.dataset.scoreField]=inp.value});modalRoot.querySelectorAll('[data-score-status]').forEach(inp=>{const cid=inp.dataset.cid;if(!e.scores[esId][cid])e.scores[esId][cid]={time:'',points:'',penalties:''};e.scores[esId][cid].status=inp.value});save();closeModal();render();toast('Scores saved.')};document.getElementById('clearStageScores').onclick=()=>{if(confirm('Clear all scores for this stage?')){delete e.scores?.[esId];save();closeModal();render();toast('Stage scores cleared.')}}}
function exportCSV(e){const rows=[['Event',e.name],['Date',e.date],['Location',e.location||''],[],['Overall leaderboard'],['Rank','Competitor','Aggregate points','Stages scored'],...overall(e).map((r,i)=>[i+1,r.name,r.total,`${r.completed}/${e.stages.length}`]),[],['Stage results']];e.stages.forEach((es,i)=>{const s=stageForEvent(e,es);rows.push([], [`Stage ${i+1}`,s.name],['Rank','Competitor','Raw time (sec)','Raw points','Penalties (sec)','Calculated result','Placement points']);stageResults(e,es).forEach(r=>rows.push([r.place,r.name,r.raw.time,r.raw.points,r.raw.penalties,r.value,r.points]))});const csv=rows.map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');download(`${slug(e.name)}-results.csv`,csv,'text/csv');toast('CSV exported.')}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'match'}function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backupModal(){openModal('Backup / restore',`<div class="stack"><div class="notice"><strong>Local data:</strong> events, scorecards, saved stages, and competitors are stored in this browser on this tablet. Use backups before clearing browser data or changing devices.</div><div class="panel" style="box-shadow:none"><h3>Export full backup</h3><p class="muted small">Downloads a JSON file containing your stage library, competitor roster, events, and scores.</p><button id="exportBackup" class="primary">Download backup</button></div><div class="panel" style="box-shadow:none"><h3>Restore backup</h3><p class="muted small">Import a previous JSON backup. This replaces the data currently in this app.</p><input id="backupFile" type="file" accept="application/json,.json"><button id="importBackup" class="danger" style="margin-top:10px">Restore selected backup</button></div></div>`,`<button id="backupDone">Done</button>`);document.getElementById('backupDone').onclick=closeModal;document.getElementById('exportBackup').onclick=()=>download(`range-scorekeeper-backup-${nowDate()}.json`,JSON.stringify({...db,backupVersion:1,exportedAt:new Date().toISOString()},null,2),'application/json');document.getElementById('importBackup').onclick=async()=>{const file=document.getElementById('backupFile').files[0];if(!file){toast('Choose a backup file first.');return}try{const parsed=JSON.parse(await file.text());if(!Array.isArray(parsed.events)||!Array.isArray(parsed.stages)||!Array.isArray(parsed.competitors))throw new Error('Invalid backup');if(!confirm('Restore will replace all data currently stored in this app. Continue?'))return;db={events:parsed.events,stages:parsed.stages,competitors:parsed.competitors,activeEvent:parsed.activeEvent||null};save();closeModal();render();toast('Backup restored.')}catch{toast('Could not read that backup file.')}}}
function initialFix(){if(db.activeEvent&&!eventById(db.activeEvent))db.activeEvent=null;db.events.forEach(e=>{e.competitorIds ||= [];e.stages ||= [];e.scores ||= {}});save()}
initialFix();render();
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(err => console.warn('Offline caching setup failed', err))); }
})();
</script></body></html>
